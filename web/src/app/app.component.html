<div class="grid grid-cols-[210px_1fr] h-screen w-screen">
  <aside class="bg-panel border-r border-border flex flex-col">
    <div class="px-4 py-5 border-b border-border flex flex-row items-center gap-2.5">
      <lucide-icon name="zap" class="w-5 h-5 text-accent shrink-0"></lucide-icon>
      <div>
        <div class="text-base font-semibold tracking-tight leading-none">andon</div>
        <div class="text-[10px] text-muted uppercase tracking-wider mt-1">Claude Code · v{{ version() ?? '…' }}</div>
      </div>
    </div>
    <nav class="flex flex-col py-2">
      <a routerLink="/overview" routerLinkActive="active" class="nav-link">
        <lucide-icon name="layout-dashboard" class="w-4 h-4"></lucide-icon>
        <span>Overview</span>
      </a>
      <a routerLink="/efficiency" routerLinkActive="active" class="nav-link">
        <lucide-icon name="gauge" class="w-4 h-4"></lucide-icon>
        <span>Efficiency</span>
      </a>
      <a routerLink="/sessions" routerLinkActive="active" class="nav-link"
         [routerLinkActiveOptions]="{ exact: false }">
        <lucide-icon name="list-filter" class="w-4 h-4"></lucide-icon>
        <span>Sessions</span>
      </a>
      <a routerLink="/files" routerLinkActive="active" class="nav-link">
        <lucide-icon name="file-text" class="w-4 h-4"></lucide-icon>
        <span>Files</span>
      </a>
      <a routerLink="/behaviour" routerLinkActive="active" class="nav-link">
        <lucide-icon name="brain" class="w-4 h-4"></lucide-icon>
        <span>Behaviour</span>
      </a>
      <a routerLink="/diagnostics" routerLinkActive="active" class="nav-link">
        <lucide-icon name="activity" class="w-4 h-4"></lucide-icon>
        <span>Diagnostics</span>
      </a>
      <a routerLink="/settings" routerLinkActive="active" class="nav-link">
        <lucide-icon name="settings" class="w-4 h-4"></lucide-icon>
        <span>Settings</span>
      </a>
    </nav>
    <div class="mt-auto px-4 py-3 text-[10px] text-muted border-t border-border font-mono">
      <div class="flex items-center"><span class="live-dot"></span>Listening</div>
      <div class="text-[9px] mt-1">:4317 grpc · :4318 http</div>
    </div>
  </aside>
  <main class="overflow-auto">
    <router-outlet />
  </main>
</div>
